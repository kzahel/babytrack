# Enable ecosystems only when their manifests and workflows exist.
# Keep major upgrades separate from routine batches for deliberate migration.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    groups:
      kotlin:
        patterns: ["org.jetbrains.kotlin.*"]
      gradle-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["org.jetbrains.kotlin.*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /apps/web
      - /tests/browser
    schedule:
      interval: weekly
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
