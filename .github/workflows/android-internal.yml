name: Android release artifacts

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate tracked version, changelog, and release tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if [ "$REF_TYPE" = tag ]; then
            python3 scripts/release_android.py --check --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/release_android.py --check --github-output "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify signing guards with disposable credentials
        run: |
          python3 scripts/check_android_release_actions.py
          python3 scripts/test_android_release.py
          python3 scripts/test_android_bundle_signing.py
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android build tools and Rust targets
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install --locked cargo-ndk --version 4.1.2
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Test and build unsigned release bundle
        run: |
          apps/android/gradlew :app:testDebugUnitTest :app:lintRelease :app:bundleRelease --no-daemon
      - name: Verify Family safety in the actual release variant
        run: apps/android/gradlew :app:testReleaseUnitTest --tests org.babytrack.app.ReleaseFamilySafetyTest --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unsigned
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 2

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-internal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: ${{ runner.temp }}/unsigned
      - name: Sign and verify with the upload key
        env:
          BABYTRACK_UPLOAD_KEYSTORE_BASE64: ${{ secrets.BABYTRACK_UPLOAD_KEYSTORE_BASE64 }}
          BABYTRACK_UPLOAD_STORE_PASSWORD: ${{ secrets.BABYTRACK_UPLOAD_PASSWORD }}
          BABYTRACK_UPLOAD_KEY_PASSWORD: ${{ secrets.BABYTRACK_UPLOAD_PASSWORD }}
          BABYTRACK_UPLOAD_KEYSTORE: ${{ runner.temp }}/babytrack-upload.p12
        run: |
          umask 077
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          raw = os.environ['BABYTRACK_UPLOAD_KEYSTORE_BASE64']
          if not raw:
              raise SystemExit('Missing upload key in android-internal environment')
          Path(os.environ['BABYTRACK_UPLOAD_KEYSTORE']).write_bytes(base64.b64decode(raw, validate=True))
          PY
          bash scripts/sign_android_bundle.sh "$RUNNER_TEMP/unsigned/app-release.aab" \
            "$RUNNER_TEMP/signed/babytrack.aab"
      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/babytrack-upload.p12"
      - name: Record source and version
        env:
          RELEASE_CODE: ${{ needs.build.outputs.version_code }}
          RELEASE_NAME: ${{ needs.build.outputs.version_name }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = {key: os.environ[key] for key in
                     ('GITHUB_SHA', 'GITHUB_RUN_ID', 'RELEASE_CODE', 'RELEASE_NAME', 'RELEASE_TAG')}
          Path(os.environ['RUNNER_TEMP'], 'signed', 'build.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: bundle
        with:
          name: babytrack-play-${{ needs.build.outputs.version_code }}
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error
          retention-days: 14
      - name: Link upload artifact
        env:
          ARTIFACT_URL: ${{ steps.bundle.outputs.artifact-url }}
        run: |
          echo "[Download the upload-signed AAB, public certificate, checksum, and build receipt]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Play promotion is a separate manual workflow requiring a tagged build and exact-source CI." >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: babytrack-play-${{ needs.build.outputs.version_code }}
          path: ${{ runner.temp }}/signed
      - name: Publish the tagged Android candidate on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          python3 scripts/release_android.py --check --tag "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          cd "$RUNNER_TEMP/signed"
          sha256sum --check babytrack.aab.sha256
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --latest=false --title "Lantern Android ${RELEASE_TAG#android-v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" babytrack.aab babytrack.aab.sha256 babytrack.aab.pem build.json
