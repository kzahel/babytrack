name: Android Play publication

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Android internal upload bundle run ID
        required: true
        type: string
      version_code:
        description: Version code in that signed artifact
        required: true
        type: string
      track:
        description: Destination
        type: choice
        options: [internal, production]
        default: production
      status:
        description: Check access, save a draft, or submit for review/distribution
        type: choice
        options: [check, draft, completed]
        default: check
      release_notes:
        description: English release notes (maximum 500 characters)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: android-play-publication
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ steps.provenance.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify publisher regressions
        run: |
          python3 scripts/check_android_release_actions.py
          python3 scripts/test_android_publishing.py
      - name: Require a successful main build and full source checks
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run_id }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path]))
          run_id = os.environ['BUILD_RUN']
          assert re.fullmatch(r'[1-9][0-9]*', run_id), 'Invalid build run ID'
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['VERSION_CODE']), 'Invalid version code'
          repo = os.environ['GITHUB_REPOSITORY']
          run = api(f'repos/{repo}/actions/runs/{run_id}')
          assert run['head_repository']['full_name'] == repo
          assert run['head_branch'] == 'main' and run['event'] == 'workflow_dispatch'
          assert run['path'] == '.github/workflows/android-internal.yml'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          sha = run['head_sha']
          checks = api(f'repos/{repo}/actions/workflows/scaffold.yml/runs?head_sha={sha}&status=success&per_page=100')
          assert any(r['head_branch'] == 'main' and r['event'] in ('push', 'schedule', 'workflow_dispatch')
                     and r['head_repository']['full_name'] == repo
                     for r in checks['workflow_runs']), 'Full scaffold checks must pass for the exact source'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'source={sha}\n')
          PY

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-play-${{ inputs.track }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check configured publication access and release gate
        env:
          PROVIDER: ${{ vars.ANDROID_PLAY_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.ANDROID_PLAY_SERVICE_ACCOUNT }}
          PUBLIC_READY: ${{ vars.ANDROID_PUBLIC_RELEASE_READY }}
          TRACK: ${{ inputs.track }}
          STATUS: ${{ inputs.status }}
        run: |
          test -n "$PROVIDER" && test -n "$ACCOUNT"
          if [ "$TRACK" = production ] && [ "$STATUS" = completed ]; then
            test "$PUBLIC_READY" = true || { echo 'Complete and record the public-release gate first'; exit 1; }
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: babytrack-play-${{ inputs.version_code }}
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify artifact receipt and checksum before authentication
        env:
          SOURCE: ${{ needs.verify.outputs.source }}
          BUILD_RUN: ${{ inputs.build_run_id }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from publish_android_bundle import verify_candidate
          verify_candidate(Path(os.environ['RUNNER_TEMP']) / 'candidate', os.environ['SOURCE'],
                           os.environ['BUILD_RUN'], os.environ['VERSION_CODE'])
          PY
      - name: Authenticate with short-lived Google Play credentials
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.ANDROID_PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.ANDROID_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload and commit the Play edit
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SOURCE: ${{ needs.verify.outputs.source }}
          BUILD_RUN: ${{ inputs.build_run_id }}
          VERSION_CODE: ${{ inputs.version_code }}
          TRACK: ${{ inputs.track }}
          STATUS: ${{ inputs.status }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          printf '%s' "$NOTES" > "$RUNNER_TEMP/notes.txt"
          python3 scripts/publish_android_bundle.py "$RUNNER_TEMP/candidate" \
            --source "$SOURCE" --run-id "$BUILD_RUN" --version-code "$VERSION_CODE" \
            --track "$TRACK" --status "$STATUS" --notes-file "$RUNNER_TEMP/notes.txt"
          cat "$RUNNER_TEMP/candidate/publication.json" >> "$GITHUB_STEP_SUMMARY"
          echo 'Check Play Console for review and live availability.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: play-publication-${{ inputs.version_code }}-${{ inputs.track }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/publication.json
          if-no-files-found: ignore
