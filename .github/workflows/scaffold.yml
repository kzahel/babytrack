name: Scaffold checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: scaffold-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Show pinned toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build and test native targets
        run: |
          cargo check --workspace --locked
          cargo test --workspace --locked
      - name: Compile wasm boundary
        run: cargo check -p babytrack-core-wasm --target wasm32-unknown-unknown --locked
      - name: Install wasm-bindgen CLI
        run: cargo install --locked wasm-bindgen-cli --version 0.2.127
      - name: Run wasm JavaScript byte smoke
        run: bash scripts/check_wasm_smoke.sh
      - name: Exclude fixture primitives from production bindings
        run: bash scripts/check_fixture_api_boundary.sh
      - name: Verify dependency direction
        run: python3 scripts/check_workspace.py
      - name: Check crate licenses and dependencies
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          rust-version: "1.92.0"
          command: check
          command-arguments: bans licenses sources advisories

  native:
    name: Native bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Kotlin and available Swift bindings
        run: bash scripts/check_native_smoke.sh

  browser:
    name: Browser wasm storage smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium shell
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps --only-shell chromium
      - name: Install wasm-bindgen CLI
        run: cargo install --locked wasm-bindgen-cli --version 0.2.127
      - name: Exercise wasm and IndexedDB
        run: bash scripts/check_browser_smoke.sh
      - name: Exercise responsive web tracking
        run: bash scripts/check_web_ui.sh
      - name: Exercise web joining and shared tracking
        run: bash scripts/check_web_shared_ui.sh

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android build tools and Rust targets
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install --locked cargo-ndk --version 4.1.2
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Build source-linked debug APK
        run: apps/android/gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Render Android fixture gallery without an emulator
        run: bash scripts/render_android_gallery.sh
      - name: Keep Android screen gallery
        id: screen-gallery
        uses: actions/upload-artifact@v4
        with:
          name: babytrack-android-screen-gallery
          path: apps/android/app/build/outputs/screen-gallery/
          if-no-files-found: error
      - name: Link the screen gallery
        env:
          GALLERY_URL: ${{ steps.screen-gallery.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Android screen gallery\n\n')
              summary.write(f"[Download the scrolling gallery]({os.environ['GALLERY_URL']})\n\n")
              summary.write('Unzip and open `index.html`: synthetic fixtures rendered with the production Compose screens, in dark/light and normal/1.5× text. Long screens include additional scroll positions.\n')
          PY
      - name: Keep dogfood artifact
        uses: actions/upload-artifact@v4
        with:
          name: babytrack-android-apks
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  android-relay:
    name: Android real-relay emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: actions/download-artifact@v4
        with:
          name: babytrack-android-apks
          path: apps/android/app/build/outputs/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android sharing on a disposable relay
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: bash scripts/check_android_ci_emulator.sh
      - name: Keep Android navigation captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babytrack-android-navigation
          path: local-references/android-redesign-qa/*.png
          if-no-files-found: ignore

  required:
    name: Required checks
    if: always()
    needs: [rust, native, browser, android, android-relay]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the Rust, native, browser, Android, and relay jobs
        run: |
          test '${{ needs.rust.result }}' = success
          test '${{ needs.native.result }}' = success
          test '${{ needs.browser.result }}' = success
          test '${{ needs.android.result }}' = success
          test '${{ needs['android-relay'].result }}' = success
