name: Scaffold checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Show pinned toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build and test native targets
        run: |
          cargo check --workspace --locked
          cargo test --workspace --locked
      - name: Compile wasm boundary
        run: cargo check -p babytrack-core-wasm --target wasm32-unknown-unknown --locked
      - name: Install wasm-bindgen CLI
        run: cargo install --locked wasm-bindgen-cli --version 0.2.127
      - name: Run wasm JavaScript byte smoke
        run: bash scripts/check_wasm_smoke.sh
      - name: Verify dependency direction
        run: python3 scripts/check_workspace.py
      - name: Check crate licenses and dependencies
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          rust-version: "1.92.0"
          command: check
          command-arguments: bans licenses sources advisories

  native:
    name: Native bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Kotlin and available Swift bindings
        run: bash scripts/check_native_smoke.sh

  browser:
    name: Browser wasm storage smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium shell
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps --only-shell chromium
      - name: Install wasm-bindgen CLI
        run: cargo install --locked wasm-bindgen-cli --version 0.2.127
      - name: Exercise wasm and IndexedDB
        run: bash scripts/check_browser_smoke.sh

  required:
    name: Required checks
    if: always()
    needs: [rust, native, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the Rust, native, and browser jobs
        run: |
          test '${{ needs.rust.result }}' = success
          test '${{ needs.native.result }}' = success
          test '${{ needs.browser.result }}' = success
