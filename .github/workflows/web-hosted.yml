name: Hosted web

# Every passing main build of the web client is deployed as Cloudflare static
# assets against the disposable-data preview relay. Hosts, names, and the
# token live in the hosted-web environment; the private runbook documents them.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'core/**'
      - 'core-wasm/**'
      - 'wire/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/build_web.sh'
      - 'scripts/build_web_pages.sh'
      - 'scripts/check_web_ui.sh'
      - 'tests/browser/web-ui-smoke.cjs'
      - '.github/workflows/web-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Test, build, and deploy the hosted web app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: hosted-web
      url: ${{ vars.LANTERN_WEB_ORIGIN }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium shell
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps --only-shell chromium
      - name: Install wasm-bindgen CLI
        run: cargo install --locked wasm-bindgen-cli --version 0.2.127
      - name: Exercise responsive web tracking
        run: bash scripts/check_web_ui.sh
      - name: Build the hosted bundle
        run: bash scripts/build_web_pages.sh "${{ vars.LANTERN_RELAY_ORIGIN }}"
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WEB_ORIGIN: ${{ vars.LANTERN_WEB_ORIGIN }}
          WORKER_NAME: ${{ vars.LANTERN_WORKER_NAME }}
        run: |
          domain="${WEB_ORIGIN#https://}"
          config="$RUNNER_TEMP/wrangler.json"
          printf '%s\n' "{\"name\":\"$WORKER_NAME\",\"compatibility_date\":\"2026-10-06\",\"workers_dev\":true,\"assets\":{\"directory\":\"$GITHUB_WORKSPACE/apps/web/dist\",\"not_found_handling\":\"single-page-application\"},\"routes\":[{\"pattern\":\"$domain\",\"custom_domain\":true}]}" > "$config"
          npx --yes wrangler@4.149.0 deploy --config "$config"
      - name: Confirm the deployed build
        env:
          WEB_ORIGIN: ${{ vars.LANTERN_WEB_ORIGIN }}
        run: |
          build="$(git rev-parse --short HEAD)"
          for _ in $(seq 1 12); do
            if curl --fail --silent "$WEB_ORIGIN/version.json" | grep -q "\"build\":\"$build\""; then
              echo "The hosted web app serves $build"; exit 0
            fi
            sleep 5
          done
          echo "The hosted web app did not report $build" >&2; exit 1
