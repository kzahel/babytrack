name: Hosted web

# Every passing main build of the web client is served at lantern.kzahel.com
# (Cloudflare static assets) against the disposable-data preview relay.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'core/**'
      - 'core-wasm/**'
      - 'wire/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/build_web.sh'
      - 'scripts/build_web_pages.sh'
      - 'scripts/check_web_ui.sh'
      - 'tests/browser/web-ui-smoke.cjs'
      - 'deploy/cloudflare/**'
      - '.github/workflows/web-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Test, build, and deploy the hosted web app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: hosted-web
      url: https://lantern.kzahel.com
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium shell
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps --only-shell chromium
      - name: Install wasm-bindgen CLI
        run: cargo install --locked wasm-bindgen-cli --version 0.2.127
      - name: Exercise responsive web tracking
        run: bash scripts/check_web_ui.sh
      - name: Build the hosted bundle
        run: bash scripts/build_web_pages.sh "${{ vars.LANTERN_RELAY_ORIGIN }}"
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy --config deploy/cloudflare/wrangler.jsonc
      - name: Confirm the deployed build
        run: |
          for _ in $(seq 1 12); do
            if curl --fail --silent https://lantern.kzahel.com/version.json | grep -q "\"build\":\"$(git rev-parse --short HEAD)\""; then
              echo "lantern.kzahel.com serves $(git rev-parse --short HEAD)"; exit 0
            fi
            sleep 5
          done
          echo "lantern.kzahel.com did not report this build" >&2; exit 1
