[workspace]
members = ["wire", "core", "core-ffi", "core-wasm", "server", "cli"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92.0"
license = "MIT"
publish = false

[workspace.dependencies]
babytrack-wire = { path = "wire" }
babytrack-core = { path = "core" }

[patch.crates-io]
# Remove basic-toml from UniFFI's template compiler until Askama releases
# https://github.com/askama-rs/askama/pull/771. Keep this revision immutable.
askama_derive = { git = "https://github.com/askama-rs/askama", rev = "d47daf8767805c0c4dfb456145fc857bfd9c1d2c" }
