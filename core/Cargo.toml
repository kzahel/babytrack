[package]
name = "babytrack-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
babytrack-wire.workspace = true
hpke = { version = "0.14", default-features = false, features = ["alloc", "chacha", "x25519"] }
sha2 = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "=0.4.3"
rand_chacha = "0.10"
rusqlite = { version = "=0.32.1", features = ["bundled"] }

[dev-dependencies]
serde_json = "1"
